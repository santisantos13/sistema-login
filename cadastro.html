<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
    <h1><a href="home.html" class="logo">NexPlay</a></h1>
    <p>Área do cliente</p>
</header>
    
    <main>
        <section  class="register">
            <h2>Cadastrar</h2>
            <p class="descricao">Digite os seus dados para acessar a sua conta</p>
            
            <form action="">

                <label for="nome">Nome completo</label>
                <input type="text" name="nome" id="nome" placeholder="Digite seu nome..." required>

                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Digite seu email..." required>

                <label for="senha">Senha</label>
                <input type="password" name="senha" id="senha" placeholder="Digite sua senha..." required>

                <button type="submit">Cadastrar</button>
            </form>
            <p class="cadastro">Já possui uma conta?
                <a href="login.html">Login</a>
            </p>
        </section>   
    </main>
    <footer>
        <p>&copy; 2026 Santhiago | DevSchool - Todos os direitos reservados</p>
    </footer>

</body>
</html>
